<!-- 预加载：模块依赖链最深有 5 跳，逐跳发现要串行等 5 次往返。
     这里一次性声明全部依赖，让浏览器在解析 HTML 时就开始并行下载。 -->
<link rel="modulepreload" href="./vendor/three.module.js">
<link rel="modulepreload" href="./vendor/three.core.js">
<link rel="modulepreload" href="./vendor/addons/controls/OrbitControls.js">

<link rel="modulepreload" href="./exp/common.js">
<link rel="modulepreload" href="./exp/props.js">
<link rel="modulepreload" href="./exp/mechanics.js">
<link rel="modulepreload" href="./exp/optics.js">
<link rel="modulepreload" href="./exp/acoustics.js">
<link rel="modulepreload" href="./exp/electricity.js">
<link rel="modulepreload" href="./exp/thermal.js">
<link rel="preload" as="fetch" href="./data/experiments.json" crossorigin="anonymous">
<style>
:root{
  --color-bg:#0B1120;
  --color-panel:#26324A;                 /* 新增：面板底色（左面板+统计面板+窄屏抽屉），比 3D 视区亮一档；--color-bg 只管视区 */
  --color-surface:#323F5C;
  --color-surface-hover:#3C4A6B;
  --color-border:#46557A;
  --color-text:#FFFFFF;
  --color-text-secondary:#B4C0D4;
  --color-primary:#3B82F6;
  --font-sans:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",Consolas,monospace;
  --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-full:999px;
  --shadow-1:0 1px 2px rgba(0,0,0,.30);
  --shadow-2:0 4px 12px rgba(0,0,0,.35);
  --shadow-panel:4px 0 24px rgba(0,0,0,.40);
  --shadow-glow:0 0 0 3px rgba(59,130,246,.35);
  --shadow-drawer:0 -8px 24px rgba(0,0,0,.45);
  --dur-fast:120ms; --dur-base:200ms; --dur-slow:300ms;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --tab-c:var(--color-primary);
  --tab-rgb:59,130,246;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text);overflow:hidden}
button{font-family:inherit}

/* 焦点环（附录 B.5 按钮通用态：outline 2px primary + glow）。
 * 用 :focus-visible 而非 :focus：鼠标点击不显环，键盘 Tab 才显，避免满屏蓝框。
 * :where() 零特异度，不覆盖任何组件自己的描边/底色。 */
:where(button,input,select,textarea,a[href],[tabindex]):focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;box-shadow:var(--shadow-glow)}
/* 滑杆拇指另加一圈：轨道细，只给 input 画环看不出拇指在哪 */
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px rgba(0,0,0,.35),var(--shadow-glow)}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:var(--shadow-glow)}

#app{display:grid;grid-template-columns:320px 1fr;grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh}
@media (min-width:768px) and (max-width:1023px){ #app{grid-template-columns:280px 1fr} }

/* ---------- 左侧面板 ---------- */
#panel{display:flex;flex-direction:column;background:var(--color-panel);border-right:1px solid var(--color-border);box-shadow:var(--shadow-panel);min-width:0;min-height:0}   /* 窄屏抽屉继承此背景，无需单独规则 */
.p-header{padding:16px 16px 12px;border-bottom:1px solid var(--color-border)}
.app-name{font-size:20px;line-height:28px;font-weight:600}
.app-sub{font-size:12px;line-height:18px;color:var(--color-text-secondary);margin-top:2px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px}
/* 视图模式切换：按模块 / 按课本章节（章节视图，nobook/yanwulab 同款） */
.view-mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:10px;background:var(--color-surface);border-radius:var(--radius-full);padding:3px}
.vm-btn{height:28px;border:none;border-radius:var(--radius-full);background:transparent;color:var(--color-text-secondary);font-size:12px;cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast)}
.vm-btn.active{background:var(--color-primary);color:#fff}
/* 指导抽屉：goal / formula / phenomenon / chapter / zeroHint */
.guide-link{all:unset;cursor:pointer;font-size:11px;color:var(--color-primary);padding:2px 6px;border-radius:var(--radius-sm)}
.guide-link:hover{background:var(--color-surface)}
.guide-drawer{border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.gd-row{display:flex;flex-direction:column;gap:2px}
.gd-k{font-size:11px;color:var(--color-text-secondary);letter-spacing:.05em}
.gd-v{font-size:13px;line-height:19px;color:var(--color-text)}
.gd-formula{font-family:var(--font-mono);font-size:12.5px;color:#7DB4FF}
.gd-zero{font-size:12px;line-height:18px;color:#F5B04C;background:rgba(245,176,76,.08);border-radius:var(--radius-md);padding:6px 8px}
.gd-safe{font-size:11px;color:var(--color-text-secondary);opacity:.7;border-top:1px solid var(--color-border);padding-top:8px;margin-top:2px}
.tab{height:36px;border:1px solid transparent;border-radius:var(--radius-full);background:transparent;color:var(--color-text-secondary);font-size:13px;cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast);white-space:nowrap}
.tab:hover{background:var(--color-surface)}
.tab.active{background:rgba(var(--tab-rgb),.15);color:var(--tab-c);border-color:rgba(var(--tab-rgb),.4)}
.tab .tcount{font-family:var(--font-mono);font-size:12px;opacity:.75;margin-left:2px}

.drawer-handle{display:none}

.p-scroll{flex:1;overflow-y:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:16px;min-height:0}
.section-title{font-size:12px;line-height:18px;color:var(--color-text-secondary);letter-spacing:.05em;margin-bottom:8px}

/* 场景列表：2 列卡片网格 + 卡片内部滚动（不缩字号） */
.scene-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ch-head{grid-column:1/-1;font-size:11px;line-height:16px;color:var(--color-text-secondary);letter-spacing:.05em;padding:6px 2px 0;border-top:1px solid var(--color-border)}
.ch-head:first-child{border-top:none;padding-top:0}
.card-sub{display:block;font-size:10px;line-height:14px;color:var(--color-text-secondary);font-weight:400;margin-top:2px}
.scene-card{position:relative;text-align:left;border:1px solid transparent;border-radius:var(--radius-lg);background:var(--color-surface);padding:8px 10px 8px 12px;min-height:56px;max-height:88px;overflow-y:auto;font-size:13px;line-height:18px;font-weight:500;color:var(--color-text);cursor:pointer;transition:background var(--dur-fast) ease;scrollbar-width:thin}
.scene-card:hover{background:var(--color-surface-hover)}
.scene-card.active{background:rgba(var(--tab-rgb),.12);border-color:rgba(var(--tab-rgb),.35);box-shadow:inset 4px 0 0 var(--tab-c)}
.scene-card .chap{display:block;font-size:12px;line-height:16px;font-weight:400;color:var(--color-text-secondary);margin-top:3px}
.scene-card .seq{display:inline-block;min-width:22px;margin-right:6px;font-size:11px;line-height:16px;font-weight:600;color:var(--color-text-secondary);font-variant-numeric:tabular-nums;vertical-align:1px}
.scene-card.active .seq{color:var(--tab-c)}

/* 读数卡（result / secondaryResult） */
.readout-card{background:var(--color-surface);border-radius:var(--radius-lg);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.readout-card + .readout-card{margin-top:8px}
.readout-card.secondary .rval{font-weight:500}
.rlabel{font-size:13px;line-height:20px;font-weight:500;color:var(--color-text)}
.rmain{display:flex;align-items:baseline;gap:6px}
.rval{font-family:var(--font-mono);font-size:13px;line-height:20px;font-weight:600;transition:color var(--dur-fast) ease}
.rval.flash{color:var(--color-primary)}
.rval.state{font-family:var(--font-sans);color:var(--tab-c)}
.rval.empty{color:var(--color-text-secondary);font-weight:500}
.runit{font-size:12px;line-height:16px;color:var(--color-text-secondary);background:var(--color-surface-hover);border-radius:var(--radius-sm);padding:1px 6px}

/* 参数控件 */
.param-block{margin-top:12px}
.param-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;line-height:20px;font-weight:500}
.pval{font-family:var(--font-mono);font-size:13px;font-weight:600}
.punit{font-size:12px;color:var(--color-text-secondary);background:var(--color-surface-hover);border-radius:var(--radius-sm);padding:1px 6px}
.pline{display:flex;align-items:baseline;gap:5px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin-top:6px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:var(--radius-full);background:linear-gradient(to right,var(--tab-c) var(--fill,50%),var(--color-surface-hover) var(--fill,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);transition:transform var(--dur-fast) ease}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.25)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25);box-shadow:var(--shadow-glow)}
input[type=range]::-moz-range-track{height:4px;border-radius:var(--radius-full);background:var(--color-surface-hover)}
input[type=range]::-moz-range-progress{height:4px;border-radius:var(--radius-full);background:var(--tab-c)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #fff}

.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg button{height:30px;padding:0 12px;border-radius:var(--radius-md);background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text-secondary);font-size:13px;cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast)}
.seg button:hover{background:var(--color-surface-hover)}
.seg button.active{background:rgba(var(--tab-rgb),.15);color:var(--tab-c);border-color:rgba(var(--tab-rgb),.4)}

.dropdown{position:relative;margin-top:6px}
.dropdown>button{width:100%;height:32px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;border-radius:var(--radius-md);background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text);font-size:13px;cursor:pointer}
.dropdown>button:hover{background:var(--color-surface-hover)}
.dropdown>button svg{flex:none;opacity:.6}
.dropdown ul{position:absolute;top:36px;left:0;right:0;z-index:30;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--shadow-2);max-height:180px;overflow-y:auto;padding:4px;list-style:none}
.dropdown li{padding:6px 10px;border-radius:6px;font-size:13px;color:var(--color-text);cursor:pointer}
.dropdown li:hover{background:var(--color-surface-hover)}
.dropdown li.active{color:var(--tab-c)}

.p-footer{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--color-border);display:flex;gap:8px}
.btn{flex:1;height:36px;border-radius:var(--radius-md);font-size:14px;font-weight:500;cursor:pointer;transition:filter var(--dur-fast),transform var(--dur-fast)}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.97)}
.btn-secondary{background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text)}
.btn-primary{background:var(--color-primary);border:none;color:#fff}

/* ---------- 右侧视区 ---------- */
#viewport{position:relative;overflow:hidden;background:radial-gradient(1200px 800px at 50% 30%,#12203A 0%,var(--color-bg) 70%);min-width:0}
#viewport canvas{position:absolute;inset:0;display:block}
#labelRoot{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;font-family:var(--font-mono)}
.scene-chip{position:absolute;top:12px;left:12px;z-index:5;display:flex;align-items:center;gap:8px;background:rgba(16,24,40,.85);backdrop-filter:blur(8px);border-radius:var(--radius-full);padding:6px 12px;box-shadow:var(--shadow-1)}
.chip-dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip-name{font-size:13px;font-weight:500}
.chip-sub{font-size:12px;color:var(--color-text-secondary)}
.playbar{position:absolute;left:16px;bottom:max(16px, env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:8px;background:rgba(16,24,40,.85);backdrop-filter:blur(8px);border-radius:var(--radius-full);padding:6px 8px;box-shadow:var(--shadow-2)}
.pb-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#fff;display:grid;place-items:center;cursor:pointer}
.pb-btn:hover{background:rgba(255,255,255,.16)}
.pb-speeds{display:flex;gap:2px}
.pb-speed{height:26px;padding:0 10px;border-radius:var(--radius-full);background:transparent;border:none;color:var(--color-text-secondary);font-size:12px;font-family:var(--font-mono);cursor:pointer}
.pb-speed:hover{color:var(--color-text)}
.pb-speed.active{background:var(--color-primary);color:#fff}
.pb-btn:disabled,.pb-speed:disabled{opacity:.35;cursor:not-allowed}
.timebar{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:5;width:clamp(280px,40%,560px);display:flex;align-items:center;gap:8px;background:rgba(16,24,40,.85);backdrop-filter:blur(8px);border-radius:var(--radius-full);padding:4px 10px;box-shadow:var(--shadow-2)}
.timebar.disabled{opacity:.35;border:1px dashed var(--color-border)}
.timebar input[type=range]{flex:1;margin-top:0;height:16px}
.timebar input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--color-primary) var(--fill,0%),var(--color-surface-hover) var(--fill,0%))}
.timebar input[type=range]::-moz-range-progress{background:var(--color-primary)}
.timebar input[type=range]::-webkit-slider-thumb{width:12px;height:12px;margin-top:-4.5px;border-width:1.5px}
.timebar input:disabled{opacity:.35;cursor:not-allowed}
.timebar input:disabled::-webkit-slider-thumb{display:none}
.tb-time{flex:none;font-family:var(--font-mono);font-size:12px;line-height:16px;color:var(--color-text-secondary);white-space:nowrap}
.hint-chip{position:absolute;right:16px;bottom:16px;z-index:5;font-size:12px;color:var(--color-text-secondary);background:rgba(16,24,40,.7);border-radius:var(--radius-full);padding:6px 12px;pointer-events:none}
#fade{position:absolute;inset:0;z-index:40;background:var(--color-bg);opacity:0;pointer-events:none;transition:opacity 150ms ease}
#fade.on{opacity:1;pointer-events:auto}
#toast{position:absolute;top:16px;left:50%;z-index:50;transform:translate(-50%,-8px);opacity:0;background:rgba(16,24,40,.92);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:8px 14px;font-size:13px;pointer-events:none;transition:opacity var(--dur-base),transform var(--dur-base)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.err-chip{position:absolute;top:60px;left:12px;z-index:6;max-width:70%;background:rgba(127,29,29,.85);border:1px solid rgba(248,113,113,.4);border-radius:var(--radius-md);padding:8px 12px;font-size:13px}

/* ---------- 右侧统计面板（实时物理量，可收起；窄屏默认收起） ---------- */
#stats{position:absolute;top:64px;right:16px;z-index:6;width:236px;max-width:calc(100vw - 24px);max-height:calc(100% - 180px);display:flex;flex-direction:column;background:var(--color-panel);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-2);overflow:hidden;transition:width var(--dur-base) var(--ease-in-out)}
#stats.collapsed{width:auto}
.stats-head{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;cursor:pointer;user-select:none;flex:none}
.stats-title{font-size:12px;line-height:18px;letter-spacing:.05em;color:var(--color-text-secondary)}
.stats-count{font-size:11px;line-height:16px;font-family:var(--font-mono);color:var(--color-text-secondary);opacity:.85}
.stats-toggle{width:22px;height:22px;flex:none;margin-left:auto;border:none;border-radius:var(--radius-full);background:transparent;color:var(--color-text-secondary);display:grid;place-items:center;cursor:pointer}
.stats-toggle:hover{background:var(--color-surface-hover);color:var(--color-text)}
.stats-toggle svg{transition:transform var(--dur-base)}
#stats.collapsed .stats-toggle svg{transform:rotate(180deg)}
.stats-body{padding:2px 10px 10px;overflow-y:auto;min-height:0;scrollbar-width:thin}
#stats.collapsed .stats-body{display:none}
#stats .readout-card{padding:8px 10px}
#stats .rlabel{font-size:12px;line-height:17px;font-weight:400}
#stats .rval{font-size:13px}

/* ---------- 音频开关（视区右上角，统计面板上方；默认静音） ---------- */
#audioBtn{position:absolute;top:16px;right:16px;z-index:7;width:36px;height:36px;border-radius:var(--radius-full);background:rgba(16,24,40,.85);backdrop-filter:blur(8px);border:1px solid var(--color-border);color:var(--color-text-secondary);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-2)}
#audioBtn:hover{color:var(--color-text)}
#audioBtn.on{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-text)}
#audioBtn:disabled{opacity:.5;cursor:default}

/* ---------- 物理引擎加载遮罩（首次进入刚体场景时出现） ---------- */
#ammoLoad{position:absolute;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:var(--color-bg);opacity:.94;flex-direction:column;text-align:center}
#ammoLoad .boot-ring{width:34px;height:34px;border-radius:50%;border:3px solid rgba(148,163,184,.22);border-top-color:var(--color-primary);animation:bootspin .9s linear infinite;margin:0 auto 16px}
#ammoLoad .boot-title{color:var(--color-text);font:500 15px/1.5 var(--font-sans)}
#ammoLoad .boot-sub{color:var(--color-text-secondary);font:400 12px/1.6 var(--font-sans);margin-top:6px;max-width:360px;padding:0 24px}

/* ---------- 移动端：底部抽屉 ---------- */
@media (max-width:767px){
  #app{display:block}
  #viewport{height:100vh}
  #panel{position:fixed;left:0;right:0;bottom:0;top:auto;height:55vh;transform:translateY(calc(100% - 64px));transition:transform var(--dur-slow) var(--ease-in-out);border-right:none;border-top:1px solid var(--color-border);border-radius:16px 16px 0 0;box-shadow:var(--shadow-drawer);z-index:20}
  #panel.open{transform:translateY(0)}
  .drawer-handle{display:flex;height:64px;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--color-text-secondary);font-size:13px}
  .drawer-handle svg{transition:transform var(--dur-base)}
  #panel.open .drawer-handle svg{transform:rotate(180deg)}
  .p-header{padding-top:0}
  .app-name,.app-sub{display:none}
  .tabs{margin-top:0}
  .tab{font-size:13px;height:40px}                      /* 抽屉全宽，五格各 ~70px，容得下「力学」+计数；触控目标 ≥40px（B.7） */
  .timebar{bottom:68px}                                 /* <768px：上移到播放工具条上方 8px */
}
/* ---------- 断点补齐（附录 B.7）：宽屏 360px 面板 / 矮视口抽屉 45vh ---------- */
@media (min-width:1600px){ #app{grid-template-columns:360px 1fr} }
@media (max-width:767px) and (max-height:599px){ #panel{height:45vh} }

/* ---------- 减弱动效（附录 B.6 无障碍承诺落地） ----------
 * 原则：空间移动（滑行、旋转、缩放）直接到位；颜色与透明度过渡保留——
 * 场景交叉淡入 #fade、toast 淡入淡出、启动遮罩淡出都是 opacity，不在降级之列。 */
@media (prefers-reduced-motion: reduce){

}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/addons/controls/OrbitControls.js';
import { CSS2DRenderer } from './vendor/addons/renderers/CSS2DRenderer.js';
import { COLORS } from './exp/common.js';

/* 色彩同源自检（附录 B.8）：:root 基础色与 COLORS 常量表是同一 token 的双载体，
 * 任一侧改动而另一侧没跟上，启动即告警，不等视觉走样才发现。 */
{
  const cs = getComputedStyle(document.documentElement);
  for(const [k, v] of [['--color-bg', COLORS.bg], ['--color-primary', COLORS.primary]]){
    const css = cs.getPropertyValue(k).trim();
    if(css.toLowerCase() !== v.toLowerCase()) console.warn('[token drift] ' + k + ': CSS ' + css + ' ≠ COLORS ' + v);
  }
}

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
function el(tag, cls){ const n = document.createElement(tag); if(cls) n.className = cls; return n; }
function hexToRgb(hex){
  const h = hex.replace('#','');
  return parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16);
}
function fmtNum(v){
  if(typeof v === 'number'){
    if(!isFinite(v)) return '—';
    const a = Math.abs(v);
    let s = a >= 100 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : v.toFixed(2);
    s = s.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
    return s === '-0' ? '0' : s;
  }
  return v; // 字符串：状态词或 '—'
}
let toastTimer = 0;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ---------- 数据 ---------- */
const MODULES = [
  { id:'mechanics',   label:'力学' },
  { id:'electricity', label:'电学' },
  { id:'optics',      label:'光学' },
  { id:'acoustics',   label:'声学' },
  { id:'thermal',     label:'热学' },
];
const SPEEDS = [0.25, 0.5, 1, 2, 4, 8];    // 六档：0.25 供短场景慢放（A1/F3 defaultSpeed=0.25），4/8 保住 F1/F2 快进
let DATA = null;          // { meta, byId, byModule }
let REG = null;           // experiments.js 的 EXPERIMENTS

/* ---------- 应用状态 ---------- */
const store = {
  module: 'mechanics',
  experimentId: null,
  params: {},                                  // id -> number | string(enum 原始 value)
  playback: { playing: true, speed: 1 },
  simTime: 0,                                  // 统一仿真时钟：播放推进、切场景归零、拖动条 seek
  readouts: {},                                // result/secondaryResult id -> number | string
};
const pending = new Set();                     // 待合并到下一帧的 onParam key（rAF 合并，不 debounce）
let switchToken = 0;
let curDuration = 0;                                   // 当前实验 duration；0 = 无时间演化（工具条置灰）
let seekPending = null;                                // 时间条 seek，rAF 合并每帧至多一次
let current = { scene: null, exp: null };

/* ---------- three.js 引擎 ---------- */
const viewport = $('#viewport');
const labelRoot = $('#labelRoot');
let renderer, camera, controls, labelRenderer;
function initEngine(){
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  // 阴影已全局关闭（用户要求：所有实验物件影子删掉），不再做 shadow pass
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  viewport.insertBefore(renderer.domElement, viewport.firstChild);

  camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
  camera.position.set(6, 4.5, 8);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 2; controls.maxDistance = 30;
  controls.maxPolarAngle = 0.495 * Math.PI;
  controls.enablePan = true;                             // 平移：右键/中键拖动，教学时把模型挪回视野中央
  controls.screenSpacePanning = true;                    // 平移跟随屏幕方向，斜拖不漂
  controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN };
  controls.target.set(0, 1, 0);

  labelRenderer = new CSS2DRenderer();
  const ld = labelRenderer.domElement;
  ld.style.position = 'absolute'; ld.style.inset = '0'; ld.style.pointerEvents = 'none';
  labelRoot.appendChild(ld);                   // ctx.labelRoot 即它，实验只管往场景里加 CSS2DObject

  const ro = new ResizeObserver(() => {
    const w = viewport.clientWidth, h = viewport.clientHeight;
    if(!w || !h) return;
    renderer.setSize(w, h);
    labelRenderer.setSize(w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  });
  ro.observe(viewport);

  $('#hintChip') && viewport.addEventListener('pointerdown', () => {
    const h = $('#hintChip'); if(h) h.remove();
  }, { once: true });
}
function addLights(scene){
  const hemi = new THREE.HemisphereLight(0xEAF2FF, 0x33415C, 1.0);
  scene.add(hemi);
  // 无阴影投影主光：仅照明，不做 shadow pass
  const dir = new THREE.DirectionalLight(0xffffff, 2.2);
  dir.position.set(6, 10, 4);
  scene.add(dir);
  return dir;
}
const PERSISTENT = new WeakSet();                        // 常驻资源白名单：跨场景复用、永不 dispose（props 的 MATERIALS 单例、表盘图集等）
const SLOTS = ['map','normalMap','specularMap','envMap','emissiveMap','aoMap','roughnessMap','metalnessMap','alphaMap','bumpMap'];
function keepPersistent(...rs){
  rs.forEach(r => {
    if(!r) return;
    PERSISTENT.add(r);
    if(r.isMaterial) SLOTS.forEach(k => { const t = r[k]; if(t && t.isTexture) PERSISTENT.add(t); });  // 常驻材质的贴图一并保护
  });
}
function disposeObject(root){
  root.traverse(o => {
    if(o.isLight){                                        // 灯光无阴影 RT（全局关阴影后无泄漏）；安全起见仍释放
      if(o.dispose) o.dispose();
      return;
    }
    if(o.userData && o.userData.shared) return;          // 池化资源由实验侧 refCount 管理
    if(o.geometry && !(o.geometry.userData && o.geometry.userData.shared) && !PERSISTENT.has(o.geometry)) o.geometry.dispose();
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    mats.forEach(m => {
      if((m.userData && m.userData.shared) || PERSISTENT.has(m)) return;  // 常驻材质：标记或登记任一即整组跳过（含贴图槽位）
      SLOTS.forEach(k => { const t = m[k]; if(t && t.isTexture && !PERSISTENT.has(t)) t.dispose(); });
      m.dispose();
    });
  });
}

/* ---------- 主循环：参数 rAF 合并 → step → 渲染 → 读数 ---------- */
const clock = new THREE.Clock();
let readoutLast = 0, readoutQueued = false;
function scheduleReadout(){
  const now = performance.now();
  if(now - readoutLast >= 100){ readoutLast = now; renderReadouts(); }
  else if(!readoutQueued){
    readoutQueued = true;
    setTimeout(() => { readoutQueued = false; readoutLast = performance.now(); renderReadouts(); }, 100);
  }
}
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);           // 防后台切回跳变
  if(current.exp){
    if(pending.size){                                    // 同一帧多次变更合并为每 key 一次 onParam
      window.__LAB && (window.__LAB.flushes = (window.__LAB.flushes || 0) + 1);
      for(const k of pending){
        try{ current.exp.onParam(k, store.params[k]); }catch(e){ console.error('[onParam:'+k+']', e); }
      }
      pending.clear();
    }
    if(seekPending != null && current.exp.seek){         // 时间条 seek：rAF 合并，每帧至多一次
      try{ current.exp.seek(seekPending); }catch(e){ console.error('[seek]', e); }
      seekPending = null;
    }
    const d = current.exp.duration;                      // duration 是活属性：参数改变时长时实验自行更新，外壳每帧跟随
    if(typeof d === 'number' && d !== curDuration){
      curDuration = d;
      syncDurationUI();
    }
    let eff = store.playback.playing ? dt * store.playback.speed : 0;
    if(store.playback.playing && curDuration > 0 && store.simTime >= curDuration){
      setPlaying(false);                                 // 播到末尾自动暂停，保持状态与 simTime 一致
      eff = 0;
    }
    try{ current.exp.step(eff); }catch(e){ console.error('[step]', e); }
    if(store.playback.playing && curDuration > 0){
      store.simTime = Math.min(curDuration, store.simTime + eff);
      updateTimebarValue();
    }
  }
  if(current.scene){
    renderer.render(current.scene, camera);
    labelRenderer.render(current.scene, camera);
  }
  controls.update();
  {                                                      // 平移限制：target 水平半径 ≤8、y∈[0,8]，防止拖出视野找不回
    const tg = controls.target;
    const hr = Math.hypot(tg.x, tg.z);
    if(hr > 8){ const s = 8 / hr; tg.x *= s; tg.z *= s; }
    if(tg.y < 0) tg.y = 0; else if(tg.y > 8) tg.y = 8;
  }
  audioTick();                                          // 音频随时间轴：每帧读 audioAt(t)，30ms 平滑跟随
}

/* ---------- 场景切换：令牌防竞态 + 遮罩 150/150ms + 释放 ---------- */
function defaultsOf(meta){
  const p = {};
  meta.params.forEach(x => { p[x.id] = x.default; });
  return p;
}
function switchExperiment(id, opts = {}){
  const meta = DATA.byId[id];
  if(!meta) return Promise.resolve(false);
  store.module = meta.module;
  store.experimentId = id;
  store.params = defaultsOf(meta);
  store.readouts = {};
  $('#drawerName').textContent = meta.name;
  if(!opts.keepDrawer) $('#panel').classList.remove('open');

  renderTabs(); renderSceneGrid(); renderParams(meta); renderChip(meta); renderGuide(meta);
  setSpeed(meta.defaultSpeed != null ? meta.defaultSpeed : 1);
  setPlaying(true);
  $('#playbar').style.display = 'flex';

  const tok = ++switchToken;
  $('#fade').classList.add('on');
  return new Promise(resolve => {                        // resolve 于 build 完成、#fade 撤掉：ready 从此刻起才为 true
    setTimeout(() => {
      if(tok !== switchToken){ resolve(false); return; } // 被更新的切换接管，本承诺不再代表最终状态
      audioFadeOut(0.02);                                  // 切场景 50ms 内淡出，不留残余声音
    if(current.exp && current.exp.dispose){ try{ current.exp.dispose(); }catch(e){ console.error('[dispose]', e); } }
    if(current.scene) disposeObject(current.scene);
    labelRoot.firstChild && (labelRoot.firstChild.innerHTML = '');   // 清 CSS2D 标签

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(COLORS.bg);
    scene.fog = new THREE.Fog(COLORS.bg, 18, 60);
    addLights(scene);
    camera.position.set(6, 4.5, 8);
    controls.target.set(0, 1, 0);

    const impl = REG && REG[id];
    const ctx = {
      scene, camera, controls, renderer,
      labelRoot: labelRenderer.domElement,
      emitReadout(map){ Object.assign(store.readouts, map); scheduleReadout(); },
      keep: (...rs) => keepPersistent(...rs),            // 登记常驻资源（材质/纹理/几何），切换场景时跳过释放
      // 程序化反向同步通道：实验在 step 里改参数 UI（如 F3 冲程枚举随曲轴角推进）
      ui: {
        setEnum(pid, v){
          store.params[pid] = v;
          pending.add(pid);
          paintEnumByValue(pid, v);
        },
        setParamValue(pid, v){                        // 数值滑杆外部同步（rAF 合并，不 debounce）
          store.params[pid] = v;
          pending.add(pid);
          syncSlider(pid);
        },
        getParam(pid){ return store.params[pid]; },
      },
    };
    if(impl){
      try{ impl.build(ctx); }catch(e){ console.error('[build:'+id+']', e); toast('实验构建出错，详见控制台'); }
    }else{
      viewportError('「' + meta.name + '」尚未在 experiments.js 中实现（' + id + '）');
    }
    current = { scene, exp: impl || null };
    current.cam0 = { pos: camera.position.clone(), tgt: controls.target.clone() };   // 场景初始机位（含面板补偿），重置回此位
    curDuration = (current.exp && typeof current.exp.duration === 'number') ? current.exp.duration : 0;
    setupTimebar();                                      // simTime 归零、时长/禁用态/标签刷新
    for(const p of meta.params) pending.add(p.id);       // build 后按 JSON 默认值全量 onParam 一轮
    controls.update();
    $('#fade').classList.remove('on');
    resolve(true);                                       // 场景就绪、遮罩已撤，此后可交互
  }, 160);
  });
}

/* ---------- 音频引擎：WebAudio 实时合成（零音频文件），exp.audioAt(t) 驱动，随时间轴同步 ---------- */
const audio = { ctx: null, osc: null, oscGate: null, noiseGate: null, filter: null, mode: null, on: false };
function audioEnsure(){
  if(audio.ctx) return audio.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  const ctx = new AC();                                  // 手势后创建/唤醒；创建本身不需要手势
  const master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
  const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 8000; filter.connect(master);
  const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = 440;
  const oscGate = ctx.createGain(); oscGate.gain.value = 0;
  osc.connect(oscGate); oscGate.connect(filter); osc.start();
  const len = Math.floor(ctx.sampleRate * 1.5);          // 循环白噪声源，噪声色由低通截止控制
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const noiseSrc = ctx.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
  const noiseGate = ctx.createGain(); noiseGate.gain.value = 0;
  noiseSrc.connect(noiseGate); noiseGate.connect(filter); noiseSrc.start();
  Object.assign(audio, { ctx, osc, oscGate, noiseGate, filter });
  return ctx;
}
function audioSmooth(p, v, tc){ p.setTargetAtTime(v, audio.ctx.currentTime, tc); }   // 30ms 平滑防爆音
function audioFadeOut(tc){                             // 切场景 50ms 内淡出，不留残余
  if(!audio.ctx) return;
  const t = audio.ctx.currentTime;
  audio.oscGate.gain.setTargetAtTime(0, t, tc);
  audio.noiseGate.gain.setTargetAtTime(0, t, tc);
  audio.mode = null;
}
function audioTick(){
  if(!audio.ctx) return;
  if(!audio.on || document.hidden){ if(audio.mode) audioFadeOut(0.03); return; }
  const exp = current.exp;
  let spec = null;
  if(exp && typeof exp.audioAt === 'function'){
    try{ spec = exp.audioAt(store.simTime); }catch(e){ console.error('[audioAt]', e); spec = null; }
  }
  if(!spec || !spec.mode || !(spec.gain > 0) || (spec.mode === 'pulse' && !store.playback.playing)){
    audioSmooth(audio.oscGate.gain, 0, 0.03); audioSmooth(audio.noiseGate.gain, 0, 0.03);
    audio.mode = null;
    return;
  }
  const vol = Math.max(0, Math.min(1, spec.gain));      // gain 按接口直乘总音量，实验侧已配平，引擎不做二次归一化
  if(audio.mode && audio.mode !== spec.mode){          // 模式切换：先把旧源压到 0 再起新源
    audioSmooth(audio.mode === 'noise' ? audio.noiseGate.gain : audio.oscGate.gain, 0, 0.03);
  }
  audio.mode = spec.mode;
  const t = audio.ctx.currentTime;
  if(spec.mode === 'noise'){
    audioSmooth(audio.oscGate.gain, 0, 0.03);
    audioSmooth(audio.noiseGate.gain, vol, 0.03);
    audio.filter.frequency.setTargetAtTime(Math.max(100, Math.min(12000, spec.filterHz || 8000)), t, 0.03);
  }else{
    const it = Math.max(0.06, spec.interval || 0.5);
    const gate = spec.mode === 'pulse' ? (((store.simTime % it) / it) < 0.25 ? vol : 0) : vol;  // 脉冲相位随时间轴
    audioSmooth(audio.noiseGate.gain, 0, 0.03);
    audioSmooth(audio.oscGate.gain, gate, 0.03);
    audio.filter.frequency.setTargetAtTime(12000, t, 0.03);   // 非 noise 模式复位低通，防止上一场景的 filterHz 闷掉纯音
    if(isFinite(spec.freq)) audio.osc.frequency.setTargetAtTime(Math.max(20, Math.min(8000, spec.freq)), t, 0.03);
    if(spec.wave && audio.osc.type !== spec.wave) audio.osc.type = spec.wave;
  }
}

/* ---------- ammo.js 惰性加载器（外壳统一管：单飞缓存 + 加载遮罩）；bridge 只调 loadAmmo()，不自己注入 script ---------- */
let ammoPromise = null;
let ammoReqCount = 0;                                   // 网络注入次数（探针断言用：重复进入不得二次下载）
function showAmmoOverlay(show){
  let ov = $('#ammoLoad');
  if(show){
    if(!ov){
      ov = el('div'); ov.id = 'ammoLoad';
      ov.innerHTML = '<div class="boot-ring"></div><div class="boot-title">正在加载物理引擎…</div><div class="boot-sub">首次进入刚体实验需下载约 0.3 MB，之后不再重复</div>';
      viewport.appendChild(ov);
    }
    ov.style.display = 'flex';
  }else if(ov){ ov.style.display = 'none'; }
}
function loadAmmo(){
  if(ammoPromise) return ammoPromise;                   // 单飞：并发/重复进入共享同一次下载与解析
  ammoPromise = new Promise((resolve, reject) => {
    showAmmoOverlay(true);
    ammoReqCount++;
    const s = document.createElement('script');
    s.src = './vendor/ammo/ammo.js';
    s.onload = () => {
      try{
        const A = window.Ammo;
        if(typeof A === 'function'){                    // 新式构建：工厂函数返回 Promise
          Promise.resolve(A()).then(lib => { showAmmoOverlay(false); resolve(lib); })
            .catch(e => { showAmmoOverlay(false); reject(e); });
        }else{                                          // 经典 UMD 构建（当前 vendor 这份）：同步库对象
          showAmmoOverlay(false); resolve(A);
        }
      }catch(e){ showAmmoOverlay(false); reject(e); }
    };
    s.onerror = () => { ammoPromise = null; showAmmoOverlay(false); reject(new Error('ammo.js 加载失败')); };
    document.head.appendChild(s);
  });
  return ammoPromise;
}

    b.addEventListener('click', () => setParam(p.id, o.value));
    b.dataset.oid = String(o.value);
    wrap.appendChild(b);
  });
  return wrap;
}
function makeDropdown(p){
  const wrap = el('div', 'dropdown');
  const btn = el('button'); btn.type = 'button';
  const span = el('span');
  span.textContent = labelOfOpt(p, store.params[p.id]);
  btn.appendChild(span);
  btn.insertAdjacentHTML('beforeend',
    '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>');
  const list = el('ul'); list.style.display = 'none';
  p.options.forEach(o => {
    const li = el('li');
    li.textContent = o.label;
    li.classList.toggle('active', store.params[p.id] === o.value);
    li.dataset.oid = String(o.value);
    li.addEventListener('click', () => {
      setParam(p.id, o.value);
      list.style.display = 'none';
    });
    list.appendChild(li);
  });
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const open = list.style.display !== 'none';
    document.querySelectorAll('.dropdown ul').forEach(u => { if(u !== list) u.style.display = 'none'; });
    list.style.display = open ? 'none' : 'block';
  });
  document.addEventListener('click', () => { list.style.display = 'none'; });
  wrap.append(btn, list);
  return wrap;
}
function setFill(input){
  const min = parseFloat(input.min), max = parseFloat(input.max), v = parseFloat(input.value);
  const pct = max > min ? ((v - min) / (max - min)) * 100 : 0;
  input.style.setProperty('--fill', pct + '%');
}
function setParam(id, v){
  store.params[id] = v;
  pending.add(id);                                       // rAF 合并，绝不 debounce
  const pe = paramEls[id];
  if(pe){
    pe.input.value = v;
    setFill(pe.input);
    pe.val.textContent = fmtNum(v);
  }else{
    paintEnumByValue(id, v);                             // 枚举：滑到哪亮哪
  }
  clampFollows();
}
function paintEnumByValue(id, v){                        // 枚举选中态与下拉按钮文案统一刷新（程序化改值也走这里）
  const meta = DATA.byId[store.experimentId];
  const p = meta && meta.params.find(x => x.id === id);
  if(!p) return;
  const blk = document.querySelector('.param-block[data-pid="' + id + '"]');
  if(!blk) return;
  blk.querySelectorAll('.seg button[data-oid], .dropdown li[data-oid]').forEach(n => {
    n.classList.toggle('active', n.dataset.oid === String(v));
  });
  const dbtn = blk.querySelector('.dropdown > button span');
  if(dbtn) dbtn.textContent = labelOfOpt(p, v);
}
function paintEnum(id){                                  // 重置后同步分段/下拉选中态
  const meta = DATA.byId[store.experimentId];
  const p = meta && meta.params.find(x => x.id === id);
  if(!p) return;
  paintEnumByValue(id, p.default);
}
function followMax(p){                                  // 联动上限只认显式声明：maxFactor × 依赖值；无 maxFactor 即「上限=依赖值」（如 wUseful/Q总）。maxRule 仅给人看，禁止解析
  const dep = store.params[p.maxFollow];
  if(typeof dep !== 'number') return p.max;
  const factor = p.maxFactor != null ? p.maxFactor : 1;
  return Math.min(p.max, dep * factor);
}
function clampFollows(){                                // F3 口径：max 跟随依赖值，超限静默夹紧
  const meta = DATA.byId[store.experimentId];
  if(!meta) return;
  meta.params.forEach(p => {
    if(!p.maxFollow) return;
    const pe = paramEls[p.id];
    if(!pe) return;
    const newMax = followMax(p);
    pe.input.max = newMax;                             // 原值直赋不 round，浏览器按 step 向下量化
    if(store.params[p.id] > newMax){
      const q = p.min + Math.floor((newMax - p.min) / p.step + 1e-9) * p.step;  // 钳制值也量化到步进，只向下不向上
      store.params[p.id] = Math.max(p.min, q);
      pending.add(p.id);
      pe.input.value = store.params[p.id];
      pe.val.textContent = fmtNum(store.params[p.id]);
    }
    setFill(pe.input);
  });
}
function syncSlider(id){
  const pe = paramEls[id];
  if(!pe) return;
  pe.input.value = store.params[id];
  setFill(pe.input);
  pe.val.textContent = fmtNum(store.params[id]);
}

/* ---------- 重置：300ms 补间回教材默认值（减弱动效下直接到位） ---------- */
let resetToken = 0;
const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)');
function resetAll(){
  const meta = DATA.byId[store.experimentId];
  if(!meta) return;
  if(REDUCE_MOTION.matches){                             // 不做补间：一步写默认值，收尾与补间末帧一致
    meta.params.forEach(p => { store.params[p.id] = p.default; pending.add(p.id); });
    meta.params.forEach(p => { if(p.type === 'enum') paintEnum(p.id); else syncSlider(p.id); });
    clampFollows();
    if(current.exp && current.exp.reset){ try{ current.exp.reset(); }catch(e){ console.error('[reset]', e); } }
    const c0 = current.cam0;
    if(c0){ camera.position.copy(c0.pos); controls.target.copy(c0.tgt); controls.update(); }
    store.simTime = 0;
    seekPending = null;
    updateTimebarValue();
    toast('已恢复教材默认参数');
    return;
  }
  const tok = ++resetToken;
  const t0 = performance.now(), D = 300;
  const from = Object.assign({}, store.params);
  const fromEnumOnly = meta.params.every(p => p.type === 'enum');
  const ease = k => 1 - Math.pow(1 - k, 3);
  function frame(now){
    if(tok !== resetToken) return;                       // 场景已切换，放弃本次补间
    const k = Math.min(1, (now - t0) / D);
    const e = ease(k);
    meta.params.forEach(p => {
      if(p.type === 'enum'){
        if(k >= 1 || fromEnumOnly){ store.params[p.id] = p.default; pending.add(p.id); paintEnum(p.id); }
        return;
      }
      const v = from[p.id] + (p.default - from[p.id]) * e;
      store.params[p.id] = v;
      pending.add(p.id);
      syncSlider(p.id);
    });
    clampFollows();
    if(k < 1){ requestAnimationFrame(frame); return; }
    if(current.exp && current.exp.reset){ try{ current.exp.reset(); }catch(e){ console.error('[reset]', e); } }
    const c0 = current.cam0;                             // 重置连相机一起回场景初始机位（含面板补偿）
    if(c0){ camera.position.copy(c0.pos); controls.target.copy(c0.tgt); controls.update(); }
    store.simTime = 0;                                   // 重置=参数回默认 + 时间轴回零
    seekPending = null;
    updateTimebarValue();
    toast('已恢复教材默认参数');
  }
  requestAnimationFrame(frame);
}

/* ---------- 播放控制：一套工具条，0.5/1/2/4/8 ---------- */
function renderPlayback(){
  const canPlay = curDuration > 0;                       // 置灰判据统一：duration === 0（全站口径）
  const box = $('#pbSpeeds'); box.innerHTML = '';
  SPEEDS.forEach(s => {
    const b = el('button', 'pb-speed' + (store.playback.speed === s ? ' active' : ''));
    b.type = 'button';
    b.textContent = s + '×';
    b.disabled = !canPlay;
    b.addEventListener('click', () => setSpeed(s));
    box.appendChild(b);
  });
  const pb = $('#btnPlay');
  pb.disabled = !canPlay;
  pb.innerHTML = store.playback.playing
    ? '<svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="1.5" width="3" height="9" rx="1" fill="currentColor"/><rect x="7" y="1.5" width="3" height="9" rx="1" fill="currentColor"/></svg>'
    : '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1.5l7 4.5-7 4.5z" fill="currentColor"/></svg>';
}
function setSpeed(v){
  store.playback.speed = v;
  renderPlayback();
}
function setPlaying(v){
  if(v && curDuration > 0 && store.simTime >= curDuration - 1e-6){
    store.simTime = 0;                                   // 在末尾再按播放 → 回到起点重演
    seekPending = 0;
    updateTimebarValue();
  }
  store.playback.playing = v;
  renderPlayback();
}

/* ---------- 时间拖动条：拖动即暂停 + seek（rAF 合并），松手保持暂停 ---------- */
function setupTimebar(){
  const bar = $('#timebar'), input = $('#timeRange');
  bar.style.display = 'flex';
  bar.classList.toggle('disabled', curDuration <= 0);
  input.disabled = curDuration <= 0 || !isFinite(curDuration);   // 无界时间轴禁拖（播放照常）
  input.max = curDuration > 0 && isFinite(curDuration) ? curDuration : 1;
  store.simTime = 0;
  seekPending = null;
  updateTimebarValue();
  renderPlayback();
}
function syncDurationUI(){                              // duration 变化（含变 Infinity）时刷新时间条
  const input = $('#timeRange'), bar = $('#timebar');
  const unbounded = !isFinite(curDuration);
  bar.classList.toggle('disabled', curDuration <= 0);
  input.disabled = curDuration <= 0 || unbounded;
  renderPlayback();                                     // 播放条置灰随 duration 活属性刷新（A1/A3/A6 的时长 build 后才就位）
  if(isFinite(curDuration)){
    input.max = curDuration > 0 ? curDuration : 1;
    if(store.simTime > curDuration){
      store.simTime = curDuration;                     // 时长缩短：状态钳回新末尾
      if(seekPending == null) seekPending = curDuration;
    }
  }
  updateTimebarValue();
}
function updateTimebarValue(){
  const input = $('#timeRange');
  if(isFinite(curDuration)){
    input.value = store.simTime;
    input.style.setProperty('--fill', (curDuration > 0 ? (store.simTime / curDuration) * 100 : 0) + '%');
  }
  updateTimeLabel();
}
function updateTimeLabel(){
  if(curDuration <= 0){
    const meta = DATA.byId[store.experimentId];
    const zk = meta && meta.durationZeroKind;
    $('#tbTime').textContent = (zk === 'branch' && meta.zeroHint) ? meta.zeroHint : '本实验无时间演化';
    return;
  }
  const unbounded = !isFinite(curDuration);
  $('#tbTime').textContent = unbounded
    ? store.simTime.toFixed(1) + ' / ∞ s'
    : store.simTime.toFixed(1) + ' / ' + curDuration.toFixed(1) + ' s';
}
function onTimeScrub(v){
  if(curDuration <= 0) return;
  setPlaying(false);                                     // 拖动即暂停，松手保持暂停
  store.simTime = v;
  seekPending = v;                                       // 只写外壳状态，经 animate 合并后调 exp.seek
  updateTimebarValue();
}
/* 时间重置：拨回 t=0 并暂停（用户定案 2026-11-21）；不重置参数、不动速度档。
   A2 Infinity（禁拖）与 duration=0（置灰）场景同样生效——只要 timebar 可见就能回到起点。 */
function resetTime(){
  store.playback.playing = false;
  store.simTime = 0;
  if(current.exp && current.exp.seek) seekPending = 0;   // 经 animate 合并后调 exp.seek(0)，积分型状态同步清
  else seekPending = null;
  updateTimebarValue();
  renderPlayback();
}

/* ---------- 顶部 chip / 全屏 / 抽屉 ---------- */
function renderChip(meta){
  const chip = $('#sceneChip');
  chip.style.display = 'flex';
  $('#chipDot').style.background = moduleColor(meta.module);

function bindChrome(){
  // 视图模式切换（章节视图与模块视图共用 sceneGrid，切回模块时高亮跟随当前页签）
  document.querySelectorAll('#viewMode .vm-btn').forEach(b => b.addEventListener('click', () => {
    const vm = b.dataset.vm;
    if(vm === viewMode) return;
    viewMode = vm;
    document.querySelectorAll('#viewMode .vm-btn').forEach(x => x.classList.toggle('active', x === b));
    renderSceneGrid();
  }));
  // 分步引导
  $('#guideBtn').addEventListener('click', guideOpen);
  $('#gPrev').addEventListener('click', () => { if(guideIdx > 0){ guideIdx--; guidePaint(); } });
  $('#gNext').addEventListener('click', () => {
    if(guideIdx < guideSteps.length - 1){ guideIdx++; guidePaint(); }
    else guideClose();
  });
  $('#gClose').addEventListener('click', guideClose);
  $('#guideOverlay').addEventListener('click', e => { if(e.target === $('#guideOverlay')) guideClose(); });
  // 视角预设：还原回 cam0（重置同源）；正视/侧视 = 保留 target 与距离，只转方位角
  const camPresets = () => {
    const t = controls.target, r = camera.position.distanceTo(t);
    const y = Math.max(1.2, t.y + r * 0.35);
    return {
      front: () => { camera.position.set(t.x, y, t.z + r); controls.update(); },
      side:  () => { camera.position.set(t.x + r, y, t.z); controls.update(); },
      home:  () => { const c0 = current.cam0; if(c0){ camera.position.copy(c0.pos); controls.target.copy(c0.tgt); controls.update(); } },
    };
  };
  $('#vwHome').addEventListener('click', () => camPresets().home());
  $('#vwFront').addEventListener('click', () => camPresets().front());
  $('#vwSide').addEventListener('click', () => camPresets().side());
  const tr = $('#timeRange');
  tr.addEventListener('input', e => onTimeScrub(parseFloat(e.target.value)));
  tr.addEventListener('keydown', e => {                 // ←/→ 0.5s、Shift ×4、Home/End 到端点
    if(curDuration <= 0) return;
    const step = e.shiftKey ? 2 : 0.5;
    let v = store.simTime;
    if(e.key === 'ArrowLeft') v = Math.max(0, v - step);
    else if(e.key === 'ArrowRight') v = Math.min(curDuration, v + step);
    else if(e.key === 'Home') v = 0;
    else if(e.key === 'End') v = curDuration;
    else return;
    e.preventDefault();
    onTimeScrub(v);
    tr.value = v;
  });
  $('#btnPlay').addEventListener('click', () => setPlaying(!store.playback.playing));
  $('#btnTimeReset').addEventListener('click', resetTime);
  $('#btnReset').addEventListener('click', resetAll);
  $('#btnFull').addEventListener('click', () => {
    if(!document.fullscreenElement) $('#app').requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  });
  document.addEventListener('fullscreenchange', () => {
    $('#btnFull').textContent = document.fullscreenElement ? '退出全屏' : '全屏';
  });
  $('#drawerHandle').addEventListener('click', () => $('#panel').classList.toggle('open'));
  $('#statsHead').addEventListener('click', () => setStatsCollapsed(!statsCollapsed));
  setStatsCollapsed(window.matchMedia('(max-width:767px)').matches);   // 窄屏默认收起（抽屉化）
  window.matchMedia('(max-width:767px)').addEventListener?.('change', e => setStatsCollapsed(e.matches));
  setInterval(renderStats, 100);                        // 实时数据 100ms 刷新（readouts() 由实验实现）
  // 音频开关：默认静音、localStorage 记忆；AudioContext 保持挂起，用户手势后才唤醒
  const ab = $('#audioBtn');
  paintAudioBtn(false);
  ab.addEventListener('click', () => {
    if(audio.on){
      audio.on = false; localStorage.setItem('lab-audio', '0'); audioFadeOut(0.03); paintAudioBtn(false);
      return;
    }
    const ctx = audioEnsure();
    if(!ctx){ ab.title = '当前浏览器不支持 WebAudio'; paintAudioBtn(false); return; }
    ctx.resume().then(() => { audio.on = true; localStorage.setItem('lab-audio', '1'); paintAudioBtn(true); })
                .catch(() => { ab.title = '🔇 需点击页面后重试'; });
  });
  if(localStorage.getItem('lab-audio') === '1'){        // 记住的开启态：先显示为开，等首次手势唤醒出声
    audio.on = true; paintAudioBtn(true);
    const wake = () => {
      const ctx = audioEnsure();
      if(ctx && ctx.state === 'suspended'){ ctx.resume().then(() => document.removeEventListener('pointerdown', wake)).catch(() => {}); }
      else document.removeEventListener('pointerdown', wake);
    };
    document.addEventListener('pointerdown', wake);
  }
  document.addEventListener('visibilitychange', () => { // 切后台自动挂起，回来且开着才恢复
    if(!audio.ctx) return;
    if(document.hidden) audio.ctx.suspend();
    else if(audio.on && audio.ctx.state === 'suspended') audio.ctx.resume().catch(() => {});
  });
}

boot().then(() => { window.__LAB.ready = true; });

<script>
/* Service Worker 注册：发布时在 sw.js 内注入版本号，首次打开后全站资源本地缓存，之后秒开、离线可用。
   更新链路：①主动 update()；②页面带着构建版本，直接 fetch 线上 sw.js 的 VERSION 做比对，
   不一致就注销旧 SW 并带 ?v= 重载——绕开浏览器对 SW 更新检查的节流，发布后刷新即得新版。 */
(function () {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  var BUILD = (document.querySelector('meta[name="build-version"]') || {}).content || '';
  var VER_KEY = 'phlab-ver-check';
  function check(reg) { if (reg) reg.update().catch(function () {}); }
  function checkBuildVersion() {
    if (!BUILD || BUILD.indexOf('__') === 0 || !navigator.onLine) return;
    fetch('./sw.js?ts=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (txt) {
        var m = /const VERSION = '([^']+)'/.exec(txt || '');
        if (!m) return;
        var remote = m[1];
        if (remote === BUILD) return;
        var guard = '';
        try { guard = sessionStorage.getItem(VER_KEY) || ''; } catch (e) {}
        if (guard === remote) return; // 同一版本只尝试一次，防循环
        try { sessionStorage.setItem(VER_KEY, remote); } catch (e) {}
        // 旧 SW 的导航处理会用 cached ./index.html 兜底，连 ?v= 也会被拦；先清掉 phlab-* 缓存，
        // 这样即使 unregister 还没生效，导航也会落到网络拿到新 HTML。
        (window.caches ? caches.keys().then(function (keys) {
          return Promise.all(keys.filter(function (k) { return k.indexOf('phlab-') === 0; })
            .map(function (k) { return caches.delete(k); }));
        }) : Promise.resolve()).catch(function () {}).then(function () {
          // 注销旧 SW 不必等它完成：清缓存已经足够让下一次导航走网络
          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (reg) reg.unregister().catch(function () {});
          }).catch(function () {});
          var u = new URL(location.href);
          u.searchParams.set('v', remote);
          location.replace(u.toString());
        });
      })
      .catch(function () { /* 离线或网络失败：继续用本地缓存 */ });
  }
  window.addEventListener('load', function () {
    checkBuildVersion();
    // 不依赖 register() 的返回时序：已有注册时也主动查一次新版本
    navigator.serviceWorker.getRegistration().then(function (reg) { check(reg); }).catch(function () {});
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(function (reg) {
        check(reg);
        setInterval(function () { check(reg); }, 60 * 1000);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') check(reg);
        });
      })
      .catch(function () { /* 静默失败：SW 只是加速，不阻碍使用 */ });
  });
})();
</script>
</body>
</html>
